function showTab() {
  for (const t of $("ptabs").children) t.setAttribute("aria-pressed", String(t.dataset.tab === state.tab));
  for (const n of ["ficha", "balance", "puesto", "avisos", "json"]) $("tab-" + n).hidden = n !== state.tab;
}
$("ptabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  state.tab = b.dataset.tab;
  showTab();
});
$("toggle-left").addEventListener("click", () => { $("col-left").classList.toggle("open"); draw(); });
$("toggle-right").addEventListener("click", () => { $("col-right").classList.toggle("open"); draw(); });

/* ====================================================================
   Entrada
   ==================================================================== */
function addLevel(data, file, folderName) {
  const entry = { file, folder: folderName, data: adopt(data), original: "", dirty: false };
  entry.original = JSON.stringify(entry.data);
  state.levels.push(entry);
  return entry;
}

$("open").addEventListener("click", () => $("pick").click());
$("pick").addEventListener("change", async e => {
  let ok = 0, last = -1;
  for (const f of [...e.target.files]) {
    try {
      const d = JSON.parse(await f.text());
      addLevel(d, f.name, `Chapter_${d.chapter || 1}`);
      last = state.levels.length - 1;
      ok++;
    } catch { toast(`${f.name} no se pudo leer`); }
  }
  if (last >= 0) select(last);
  if (ok) toast(ok === 1 ? "Nivel cargado" : `${ok} niveles cargados`);
  e.target.value = "";
});

addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", async e => {
  e.preventDefault();
  let ok = 0, last = -1;
  for (const f of [...(e.dataTransfer?.files || [])]) {
    if (!f.name.endsWith(".json")) continue;
    try {
      const d = JSON.parse(await f.text());
      addLevel(d, f.name, `Chapter_${d.chapter || 1}`);
      last = state.levels.length - 1;
      ok++;
    } catch { toast(`${f.name} no se pudo leer`); }
  }
  if (last >= 0) select(last);
  if (ok) toast(ok === 1 ? "Nivel cargado" : `${ok} niveles cargados`);
});

$("nuevo").addEventListener("click", () => {
  const next = state.levels.reduce((m, l) => Math.max(m, +l.data.id || 0), 0) + 1;
  const e = addLevel(blankLevel(next), String(next).padStart(3, "0") + ".json", "Chapter_1");
  e.dirty = true;
  select(state.levels.length - 1);
});

$("revert").addEventListener("click", () => {
  const c = cur();
  if (!c || !c.dirty) return;
  snapshot();
  c.data = adopt(JSON.parse(c.original));
  c.dirty = false;
  renderAll();
  toast("Vuelto a como está en el archivo");
});

   Controles
   ==================================================================== */
$("save").addEventListener("click", guardar);
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-brush]");
  if (!b) return;
  state.brush = b.dataset.brush;
  renderBrush();
});
$("zoom-in").addEventListener("click",  () => setZoom(boardScale() * 1.25));
$("zoom-out").addEventListener("click", () => setZoom(boardScale() / 1.25));
$("zoom-fit").addEventListener("click", () => setZoom(null));

// Ctrl/Cmd + rueda acerca, como en cualquier lienzo. La rueda sola sigue desplazando.
document.getElementById("boardwrap").addEventListener("wheel", e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  setZoom(boardScale() * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
}, { passive: false });

$("recipe").addEventListener("change", e => { state.recipe = e.target.value; renderBrush(); });
$("rows").addEventListener("input", e => { state.rows = Math.max(1, Math.min(MAX_ROWS, +e.target.value || 12)); draw(); });
$("search").addEventListener("input", e => { state.search = e.target.value; renderTree(); });
$("undo").addEventListener("click", () => restore(state.undo, state.redo));
$("redo").addEventListener("click", () => restore(state.redo, state.undo));
$("mirror").addEventListener("click", mirror);
$("clear").addEventListener("click", clearBoard);

const bind = (id, apply) => $(id).addEventListener("change", e => {
  if (!lvl()) return;
  snapshot();
  apply(lvl(), e.target.value);
  touch();
  renderAll();
});
bind("f-name", (d, v) => d.name = v);
bind("f-id", (d, v) => d.id = +v || 0);
bind("f-chapter", (d, v) => d.chapter = +v || 1);
bind("f-shots", (d, v) => d.max_shots = +v || 0);
bind("f-min", (d, v) => d.min_shots_to_clear = +v || 0);
bind("f-type", (d, v) => d.objective.type = v);
bind("f-s1", (d, v) => d.star_thresholds[0] = +v || 0);
bind("f-s2", (d, v) => d.star_thresholds[1] = +v || 0);
bind("f-s3", (d, v) => d.star_thresholds[2] = +v || 0);

addEventListener("keydown", e => {
  // Guardar funciona tambien escribiendo en un campo: es lo que espera cualquiera que
  // acabe de cambiar el nombre del nivel.
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); guardar(); return; }
  if (e.target.matches("input, textarea, select")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    e.shiftKey ? restore(state.redo, state.undo) : restore(state.undo, state.redo);
    return;
  }
  const map = { b: "color", o: "obstacle", r: "rescue" };
  const to = map[e.key.toLowerCase()];
  if (to) { state.brush = to; renderBrush(); }
});

addEventListener("resize", draw);

/* ====================================================================
   Arranque
   ==================================================================== */
function preload(paths) {
  return Promise.all(paths.map(p => new Promise(done => {
    const i = new Image();
    i.onload = i.onerror = () => { state.art.set(p, i); done(); };
    i.src = p;
  })));
}

(async function start() {
  try {
    // Si hay servidor local, los niveles salen del disco y Guardar escribe de verdad.
    // Si no, van empaquetados con la pagina y Guardar pide carpeta o copia.
    const probe = await fetch("api/catalog").then(r => r.ok ? r.json() : null).catch(() => null);
    state.local = !!probe;

    const [catalog, levels] = state.local
      ? [probe, await fetch("api/levels").then(r => r.json())]
      : await Promise.all([
          fetch("catalog.json").then(r => r.json()),
          fetch("levels.json").then(r => r.json()),
        ]);

    state.catalog = catalog;
    state.holds = catalog.creatures[0]?.id || catalog.objects[0]?.id || "";

    await preload([catalog.glow,
      ...catalog.colors.map(c => c.art),
      ...catalog.materials.flatMap(m => m.layers),
      ...catalog.creatures.map(c => c.art),
      ...catalog.objects.map(o => o.art)].filter(Boolean));

    for (const l of levels) addLevel(l.data, l.file, l.folder);

    renderPickers();
    if (state.local) $("now").title = "Servido en local: Guardar escribe en el proyecto";

    const start = state.levels.findIndex(l => l.data.id === 21);
    select(start >= 0 ? start : 0);
  } catch (err) {
    $("tree").innerHTML = '<p class="empty">No se pudieron cargar los niveles. Usa Abrir.</p>';
    renderAll();
  }
})();
</script>
